<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Gambar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 32px;
      width: 100%;
      max-width: 480px;
      height: fit-content;
    }

    h2 {
      font-size: 20px;
      color: #222;
      margin-bottom: 24px;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 10px;
    }

    /* DROP ZONE */
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      margin-bottom: 20px;
    }
    .drop-zone:hover, .drop-zone.over {
      border-color: #4CAF50;
      background: #f0fff0;
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .drop-zone .icon { font-size: 40px; display: block; margin-bottom: 10px; }
    .drop-zone p { font-size: 14px; color: #666; }
    .drop-zone small { font-size: 12px; color: #aaa; margin-top: 6px; display: block; }

    /* PREVIEW */
    #preview-box {
      display: none;
      margin-bottom: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 14px;
      background: #fafafa;
    }
    #preview-box h3 {
      font-size: 12px;
      color: #888;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: bold;
    }
    #preview-img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 6px;
      border: 1px solid #eee;
      display: block;
      margin-bottom: 10px;
    }
    #preview-info {
      font-size: 13px;
      color: #444;
      line-height: 1.8;
    }
    #preview-info span { color: #999; }

    /* BUTTON */
    .btn-upload {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-upload:hover { background: #43a047; }
    .btn-upload:disabled { background: #ccc; cursor: not-allowed; }

    .info-text {
      font-size: 12px;
      color: #bbb;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
<div class="card">
  <h2>📤 Unggah Gambar</h2>

  <form action="upload.php" method="post" enctype="multipart/form-data">

    <div class="drop-zone" id="drop-zone">
      <input type="file" name="fileToUpload" id="fileToUpload" accept=".jpg,.jpeg,.png,.gif">
      <span class="icon">🖼️</span>
      <p>Klik atau seret gambar ke sini</p>
      <small>JPG · JPEG · PNG · GIF &nbsp;·&nbsp; Maks. 500 KB</small>
    </div>

    <div id="preview-box">
      <h3>Pratinjau</h3>
      <img id="preview-img" src="" alt="Pratinjau">
      <div id="preview-info"></div>
    </div>

    <button type="submit" name="submit" class="btn-upload" id="btn-submit" disabled>
      Pilih file terlebih dahulu
    </button>

  </form>

  <p class="info-text">File diunggah ke folder <code>uploads/</code> di server</p>
</div>

<script>
  const fileInput  = document.getElementById('fileToUpload');
  const dropZone   = document.getElementById('drop-zone');
  const previewBox = document.getElementById('preview-box');
  const previewImg = document.getElementById('preview-img');
  const previewInf = document.getElementById('preview-info');
  const btnSubmit  = document.getElementById('btn-submit');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('over');
    if (e.dataTransfer.files.length) {
      fileInput.files = e.dataTransfer.files;
      showPreview(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', function () {
    if (this.files.length) showPreview(this.files[0]);
  });

  function showPreview(file) {
    const allowed = ['image/jpeg', 'image/png', 'image/gif'];
    if (!allowed.includes(file.type)) {
      alert('Format tidak didukung. Gunakan JPG, PNG, atau GIF.');
      reset(); return;
    }
    if (file.size > 500000) {
      alert('Ukuran file melebihi 500 KB.');
      reset(); return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      const kb = (file.size / 1024).toFixed(1);
      previewInf.innerHTML =
        '📄 <b>' + file.name + '</b><br>' +
        '<span>Ukuran:</span> ' + kb + ' KB &nbsp;&nbsp; ' +
        '<span>Tipe:</span> ' + file.type;
      previewBox.style.display = 'block';
      btnSubmit.disabled = false;
      btnSubmit.textContent = '⬆ Unggah Sekarang';
    };
    reader.readAsDataURL(file);
  }

  function reset() {
    fileInput.value = '';
    previewBox.style.display = 'none';
    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Pilih file terlebih dahulu';
  }
</script>
</body>
</html>
